{% extends "emails/base.html" %}
{% block heading %}{{ title }}{% endblock %}
{% block content %}
<p style="margin:0 0 16px 0;">Merhaba {{ user_name }},</p>
<p style="margin:0 0 16px 0;">{{ message }}</p>
{% if reason %}
<table role="presentation" cellpadding="0" cellspacing="0" width="100%" style="border-left:3px solid #008cb3;background-color:#f8fafc;border-radius:6px;">
  <tr><td style="padding:12px 16px;font-size:14px;color:#475569;"><strong>Açıklama:</strong> {{ reason }}</td></tr>
</table>
{% endif %}
{% include "emails/_button.html" with url=dashboard_url label="İşletme Paneline Git" %}
{% endblock %}
