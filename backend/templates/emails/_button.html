{% comment %}Kullanım: {% include "emails/_button.html" with url=... label=... %}{% endcomment %}
<table role="presentation" cellpadding="0" cellspacing="0" style="margin:24px 0;">
  <tr>
    <td style="background-color:#008cb3;border-radius:10px;">
      <a href="{{ url }}" style="display:inline-block;padding:13px 26px;color:#ffffff;font-weight:bold;font-size:15px;text-decoration:none;">{{ label }}</a>
    </td>
  </tr>
</table>
<p style="font-size:12px;color:#94a3b8;margin:0;">Buton çalışmazsa bu adresi tarayıcınıza yapıştırın:<br><span style="color:#64748b;word-break:break-all;">{{ url }}</span></p>
